<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Wafaa 💜</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <!-- Music Player -->
    <div class="music-player">
        <audio id="bg-music" loop>
            <!-- Replace with your music file -->
            <source src="wafaa.mp3" type="audio/mpeg">
        
        </audio>
        <button id="play-btn"><i class="fas fa-play"></i></button>
        <button id="mute-btn"><i class="fas fa-volume-up"></i></button>
        <input type="range" id="volume-control" min="0" max="1" step="0.1" value="0.5">
        <span class="song-title">For Wafaa 💜</span>
    </div>

    <div class="flower-container">
        <div class="flower flower-1">🌸</div>
        <div class="flower flower-2">🌺</div>
        <div class="flower flower-3">🌼</div>
        <div class="flower flower-4">🌷</div>
        <div class="flower flower-5">💮</div>
    </div>

    <div class="container">
        <h1>For My Dear Friend Wafaa 💜</h1>

        <div class="emoji-container">
            <span class="emoji">😊</span>
            <span class="emoji">🌸</span>
            <span class="emoji">💖</span>
            <span class="emoji">✨</span>
            <span class="emoji">🥰</span>
        </div>

        <div class="letter">
            <textarea id="letter-text" placeholder="My Dearest Wafaa 💜

            Every time you walk into a room, the air gets a little brighter—like someone switched on a golden filter just for you. 🌟 Your laugh is my favorite melody (yes, even better than the background music on this website!), and your smile? Absolutely illegal levels of cute. 😊
            
            Did you know you have this magical way of making ordinary moments feel special? Whether it’s your silly jokes, your terrible dance moves (adorable, by the way), or just the way you exist like a walking ray of sunshine—I’m so grateful to have you as my friend.
            
            I’ll stop flirting now… (Okay, maybe just one more thing: If beauty were a competition, you’d cheat by just showing up. Not fair. 😉)
            
            Thank you for being you—the kind of person who makes life sparkle a little more. Stay this amazing, okay?
            
            Forever your fav son (i hope so :>),
           Rahim
            
            💐 P.S. Consider this a virtual bouquet of purple flowers!
            
            "></textarea>
            <button id="save-btn">Save Letter 💾</button>
            <button id="theme-btn">Change Theme 🌙</button>
        </div>

        <div class="footer">
            <p>Made with 💜 for Wafaa</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
