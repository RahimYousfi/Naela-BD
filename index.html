<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Naela 💜</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <!-- Music Player -->
    <div class="music-player">
        <audio id="bg-music" loop>
            <!-- Replace with your music file -->
            <source src="wafaa.mp3" type="audio/mpeg">
        
        </audio>
        <button id="play-btn"><i class="fas fa-play"></i></button>
        <button id="mute-btn"><i class="fas fa-volume-up"></i></button>
        <input type="range" id="volume-control" min="0" max="1" step="0.1" value="0.5">
        <span class="song-title">For Naela 💜</span>
    </div>

    <div class="flower-container">
        <div class="flower flower-1">🌸</div>
        <div class="flower flower-2">🌺</div>
        <div class="flower flower-3">🌼</div>
        <div class="flower flower-4">🌷</div>
        <div class="flower flower-5">💮</div>
    </div>

    <div class="container">
        <h1>For My Dear Naela 💜</h1>

        <div class="emoji-container">
            <span class="emoji">😊</span>
            <span class="emoji">🌸</span>
            <span class="emoji">💖</span>
            <span class="emoji">✨</span>
            <span class="emoji">🥰</span>
        </div>

        <div class="letter">
            <textarea id="letter-text" placeholder="My Dearest Wafaa 💜

          HAPPY BIRTHDAY NAAELAAA!! 🎀❤️ Honestly, I'm really glad we met, and even if we only know each other online, that doesn't make our friendship any less special to me. I genuinely love having you around, talking to you, and being able to share little moments with you, and I hope we get to make a lot more memories together. You're genuinely such a lovely person, and you deserve all the happiness in the world (even if you're too short to reach it without a ladder LMAOOO 😭🤏). And don't worry, I still love you regardless of your questionable height, so consider yourself lucky, shorty. 🙄💕 But seriously, I'm really happy I got to know you, and I hope you never doubt how much I appreciate you and our friendship. I hope your birthday is as lovely as you are, and may this new year bring you nothing but happiness, good surprises, and people who love you as much as you deserve. And obviously, that includes me, so don't get too excited now. 🤭💗 HAPPY BIRTHDAY AGAIN, MY LITTLE SHORTY, LOVE YOUUU!! 🎂💋
            
            Forever your tall friend ,
           Rahim
            
            💐 P.S. Consider this a virtual bouquet of purple flowers!
            
            "></textarea>
            <button id="save-btn">Save Letter 💾</button>
            <button id="theme-btn">Change Theme 🌙</button>
        </div>

        <div class="footer">
            <p>Made with 💜 for Naela</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
